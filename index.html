<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marble Desk</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1220; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #info { position: fixed; left: 12px; top: 10px; color: #d0d8f0; font-size: 13px; line-height: 1.5;
          background: rgba(8,10,18,.7); padding: 10px 14px; border-radius: 12px; max-width: 340px; }
  #info b { color: #fff; }
  #xrnote { position: fixed; left: 12px; bottom: 70px; color: #8f98b8; font-size: 12px; max-width: 320px; }
</style>
</head>
<body>
<div id="info"><b>Marble Desk</b><br>
  Pinch pieces from the right tray, place them, then press <b>Drop</b>. Guide the marble into the glowing cup.<br>
  <span id="mode">Desktop preview: drag with the mouse. On Meta Quest, tap Enter AR and use your hands on your real desk.</span></div>
<div id="xrnote"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
